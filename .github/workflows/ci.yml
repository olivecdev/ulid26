name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build, test, package
        run: nix develop --command cmake --workflow --preset ci

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build, test under ASan/UBSan
        run: nix develop --command cmake --workflow --preset san

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build, test under TSan
        run: nix develop --command cmake --workflow --preset tsan

  coverage-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build, test with coverage
        run: nix develop --command cmake --workflow --preset cov
      - name: emit tracefile
        run: >
          nix develop --command gcovr --root . --object-directory build/cov
          --filter 'ulid26/.*' --json -o coverage-linux.json
      - name: upload tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage-linux.json

  coverage-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Debug: coverage wants full debug info and unsplit inline redundancies.
      - name: configure (MSVC, Debug)
        run: cmake -S . -B build/win-cov -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug
      - name: build
        run: cmake --build build/win-cov --config Debug
      - name: install OpenCppCoverage
        run: choco install opencppcoverage -y
      # cover_children: ctest spawns the test binaries, and those are what
      # execute the headers. Export Cobertura: gcovr ingests it at merge time.
      # Absolute path: the choco installer mutates machine PATH, which is not
      # guaranteed visible in later steps ("not recognized as a name of a
      # cmdlet"), so never resolve OpenCppCoverage via PATH.
      # Sources are scoped to the library subdir: the merge keys files as
      # ulid26/<header> (matching the Linux gcovr side), so test sources and
      # the fetched _deps headers must never enter the tracefile — gcovr
      # aborts the whole report on entries it cannot resolve under --root.
      - name: test under coverage
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" --sources "$env:GITHUB_WORKSPACE\ulid26" --cover_children
          --export_type cobertura:coverage-win.xml --
          ctest --test-dir build/win-cov -C Debug --output-on-failure
      - name: upload tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage-win.xml

  coverage-merge:
    runs-on: ubuntu-latest
    needs: [coverage-linux, coverage-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: download tracefiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      # gcovr merges by filename: strip backslashes, pin the source root, and
      # reduce every entry to ulid26/<header> (the headers are flat, so the
      # basename is the key), matching the Linux tracefile keys. The scoped
      # --sources on the Windows side guarantees only headers are present.
      - name: normalize Windows paths
        run: >
          sed -i 's|\\|/|g; s|<source>[^<]*</source>|<source>.</source>|g;
          s|filename="[^"]*/|filename="|g; s|filename="|filename="ulid26/|g' coverage-win.xml
      # The gate lives here, on the combined report: platform-specific code
      # (the MSVC CAS tier, GCC attributes) contributes hits from the side
      # that executes it, and the per-side rows in the HTML show exactly
      # which side covers what. Branch ratio stays informational
      # (GCC counts noexcept-unreachable unwind arcs). gcov misattributes
      # arcs on the reservation ternary (GCC bug 68080: negative hits), so
      # that parse error class is downgraded to a warning.
      # Single self-contained page (static, no JS): --html-details with a
      # bare prefix scatters siblings (index, .css, per-file pages) next to
      # the prefix, and the upload only carried the index — every link rotted.
      # --html-single-page collapses all of it into one file, so there is
      # exactly one artifact and no link can point nowhere. Drop `static` for
      # the interactive (JS) variant; the data is identical either way.
      - name: merge, gate, report
        run: >
          nix develop --command gcovr --json-add-tracefile coverage-linux.json
          --cobertura-add-tracefile coverage-win.xml --root .
          --filter 'ulid26/.*' --print-summary --fail-under-line 90
          --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          --html-details --html-single-page static --output coverage-html.html
      - name: upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html.html

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build fuzz harness
        run: nix develop --command cmake --workflow --preset fuzz
      # Deterministic seed-corpus gate: fixed seed, bounded run count and
      # per-unit timeout. Nonzero exit on any crash, leak, timeout or OOM.
      - name: run seed corpus
        run: nix develop --command ./build/fuzz/fuzz/fuzz_text fuzz/corpus -runs=1000000 -seed=42 -timeout=30

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Explicit configure: the presets pin Ninja, so MSVC uses -S/-B/-G.
      - name: configure (MSVC, Release)
        run: cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build/win --config Release
      - name: test
        run: ctest --test-dir build/win -C Release --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: clang-format check
        run: >
          nix develop --command clang-format --dry-run --Werror
          ulid26/ulid26.hpp ulid26/value.hpp ulid26/generators.hpp ulid26/batch.hpp ulid26/ranges.hpp
          test/value_test.cpp
          bench/bench_bytes.cpp bench/bench_is_valid.cpp bench/bench_streams.cpp bench/bench_to_chars.cpp
          fuzz/fuzz_text.cpp
