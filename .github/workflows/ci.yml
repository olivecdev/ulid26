name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: configure, build, test under ASan/UBSan
        run: nix run .#san
      - name: configure, build, test under TSan
        run: nix run .#tsan

  coverage-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: format check, configure, build, test, package
        run: nix run .#ci
      # Workflow app (see the workflows set in flake.nix): suite plus the
      # Linux tracefile for the merge.
      - name: configure, build, test with coverage
        run: nix run .#cov
      - name: upload tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage-linux.json

  coverage-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Release validation first: fast signal before the slow coverage half —
      # a red Release skips the Debug/OCC run below entirely.
      - name: configure (MSVC)
        run: cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64
      - name: build (Release)
        run: cmake --build build/win --config Release
      - name: test (Release)
        run: ctest --test-dir build/win -C Release --output-on-failure
      # Debug: coverage wants full debug info and unsplit inline redundancies.
      - name: build (Debug)
        run: cmake --build build/win --config Debug
      - name: install OpenCppCoverage
        run: choco install opencppcoverage -y
      # cover_children: ctest spawns the test binaries, and those are what
      # execute the headers. Export Cobertura: gcovr ingests it at merge time.
      # Absolute path: the choco installer mutates machine PATH, which is not
      # guaranteed visible in later steps ("not recognized as a name of a
      # cmdlet"), so never resolve OpenCppCoverage via PATH.
      # Sources are scoped to the library subdir: the merge keys files as
      # ulid26/<header> (matching the Linux gcovr side), so test sources and
      # the fetched _deps headers must never enter the tracefile — gcovr
      # aborts the whole report on entries it cannot resolve under --root.
      # continue_after_cpp_exception: the suite deliberately throws and
      # catches (the throwing-allocator probe). The default is to break into
      # the debugger on any C++ exception — with no debugger attached the run
      # hangs until the timeout instead of finishing.
      - name: test under coverage
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" --sources "$env:GITHUB_WORKSPACE\ulid26" --cover_children
          --continue_after_cpp_exception
          --export_type cobertura:coverage-win.xml --
          ctest --test-dir build/win -C Debug --output-on-failure
      - name: upload tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage-win.xml

  coverage-merge:
    runs-on: ubuntu-latest
    needs: [coverage-linux, coverage-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: download tracefiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      # Workflow app (see the workflows set in flake.nix): normalize the
      # Windows tracefile, merge, gate line coverage at 90, emit the
      # self-contained HTML page. Rationale for each flag lives with the app.
      - name: merge, gate, report
        run: nix run .#merge
      - name: upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html.html

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Workflow app (see the workflows set in flake.nix): harness plus the
      # deterministic seed-corpus gate.
      - name: configure, build, run fuzz harness
        run: nix run .#fuzz

  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install baseline toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-14
      - name: configure, build, test, package on GCC 14
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --workflow --preset ci
